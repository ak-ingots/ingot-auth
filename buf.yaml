# The gRPC contract of the addon, linted by Buf (ADR 0013 of the ecosystem):
# STANDARD but for the suffix of the services, which ADRs 0009 and 0011 leave
# out. The version of Buf is the ecosystem's: see the Makefile.
version: v2
# google.api.http of the transcoding to HTTP (AIP-127)
deps:
  - buf.build/googleapis/googleapis
modules:
  - path: .
    excludes:
      - .venv
lint:
  use:
    - STANDARD
  except:
    - SERVICE_SUFFIX
# The contract is the JSON of HTTP too: renaming a field breaks it, as
# WIRE_JSON tells, beside the wire of gRPC; and the names of gRPC, which
# WIRE_JSON leaves out: a package, a service or an RPC no longer served.
breaking:
  use:
    - WIRE_JSON
    - PACKAGE_NO_DELETE
    - PACKAGE_SERVICE_NO_DELETE
    - RPC_NO_DELETE
