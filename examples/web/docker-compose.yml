# The site and its servers, as it runs in production: the site behind its
# port, the scenarios calling it. Only that port and the API of Mailpit
# reach the host, for the scenarios.

x-app: &app
  build:
    context: ../..
    dockerfile: examples/web/Dockerfile
    args:
      PYTHON: ${WEB_PYTHON:-}
  environment:
    # a wrong config fails the start, not falls back to its default
    APP_IS_STRICT_CONFIGS: "on"
    APP_MONGODB_DEFAULT_HOST: mongodb
    APP_REDIS_DEFAULT_HOST: redis
    APP_MAIL_FROM: site@example.com
    APP_MAIL_SMTP_HOST: mailpit
    APP_MAIL_SMTP_PORT: "1025"
    APP_MAIL_SMTP_TLS: NONE
  depends_on:
    mongodb:
      condition: service_healthy
    redis:
      condition: service_healthy
    mailpit:
      condition: service_healthy

services:
  web:
    <<: *app
    ports:
      - "127.0.0.1:${WEB_TEST_SITE_PORT:-8080}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(("localhost", 8000), 1)
      interval: 2s
      timeout: 5s
      retries: 30

  # The command line of the operator, idle till a command runs in it:
  # docker compose exec cli python /srv auth access members add ...
  cli:
    <<: *app
    entrypoint: [sleep, infinity]

  # A replica set of one node, as MongoDB takes transactions on one alone.
  mongodb:
    image: mongo:9
    command: [--replSet=rs0, --bind_ip_all, --quiet]
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status() } catch (e) { rs.initiate({_id: "rs0", members:
          [{_id: 0, host: "mongodb:27017"}]}) };
          quit(db.hello().isWritablePrimary ? 0 : 1)
      # often while it starts, then seldom: each check is a connection it logs
      start_period: 60s
      start_interval: 2s
      interval: 30s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - "127.0.0.1:${WEB_TEST_MAILPIT_PORT:-8081}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 30
