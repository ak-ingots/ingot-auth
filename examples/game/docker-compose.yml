# The game and its servers, as it runs in production: two processes behind
# their ports, the scenarios calling each. Only those ports and the API of
# Mailpit reach the host, for the scenarios.

# The application, as both its services run it: the image and the
# environment, APP_*, the servers by their names in the network.
x-app: &app
  build:
    context: ../..
    dockerfile: examples/game/Dockerfile
    args:
      # by make example-test: a build needs it, a command in cli does not
      PYTHON: ${GAME_PYTHON:-}
  environment:
    # a wrong config fails the start, not falls back to its default
    APP_IS_STRICT_CONFIGS: "on"
    APP_MONGODB_DEFAULT_HOST: mongodb
    APP_REDIS_DEFAULT_HOST: redis
    APP_MAIL_FROM: game@example.com
    APP_MAIL_SMTP_HOST: mailpit
    APP_MAIL_SMTP_PORT: "1025"
    APP_MAIL_SMTP_TLS: NONE
    # a real game keeps one; three, for the scenarios of a player's devices
    # till a web example takes them
    APP_AUTH_SESSIONS_MAX: "3"
  depends_on:
    mongodb:
      condition: service_healthy
    redis:
      condition: service_healthy
    mailpit:
      condition: service_healthy

services:
  # The server of the players, the application itself.
  app:
    <<: *app
    ports:
      - "127.0.0.1:${GAME_TEST_GRPC_DEFAULT_PORT:-50061}:50051"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(("localhost", 50051), 1)
      interval: 2s
      timeout: 5s
      retries: 30

  # The second process of the game, sharing the servers of the first: a
  # session opened on one is known to the other, by the cache in Redis.
  app2:
    <<: *app
    ports:
      - "127.0.0.1:${GAME_TEST_GAME_SECOND_PORT:-50062}:50051"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(("localhost", 50051), 1)
      interval: 2s
      timeout: 5s
      retries: 30

  # The command line of the operator, idle till a command runs in it:
  # docker compose exec cli python -m app auth access members add ...
  cli:
    <<: *app
    entrypoint: [sleep, infinity]

  # A replica set of one node, as MongoDB takes transactions on one alone,
  # known by its name in the network.
  mongodb:
    image: mongo:9
    command: [--replSet=rs0, --bind_ip_all, --quiet]
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status() } catch (e) { rs.initiate({_id: "rs0", members:
          [{_id: 0, host: "mongodb:27017"}]}) };
          quit(db.hello().isWritablePrimary ? 0 : 1)
      # often while it starts, then seldom: each check is a connection it logs
      start_period: 60s
      start_interval: 2s
      interval: 30s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - "127.0.0.1:${GAME_TEST_MAILPIT_PORT:-18025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 30
