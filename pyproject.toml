[project]
name = "ingot-auth"
version = "0.11.0"
description = "Sign-up, sign-in and sessions of the users of Ingots applications."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Aliaksandr Karotki", email = "abkarotki@gmail.com"}]
keywords = ["ingots", "auth", "authentication", "sign-in", "sign-up"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    "ingot-mail>=0.5.0,<0.6",
    "ingots>=0.37.0,<0.38",
]

[project.optional-dependencies]
grpcio = ["ingot-grpcio>=0.16.0,<0.17"]
pymongo = ["ingot-pymongo>=0.17.0,<0.18"]
redis = ["ingot-redis>=0.5.0,<0.6"]
# The transport of HTTP and JSON, transcoding the contract: no grpcio.
starlette = ["ingot-starlette[protobuf]>=0.4.0,<0.5"]
# The stacks of the kinds of applications, run by examples/<kind>/.
game = ["ingot-auth[grpcio,pymongo,redis]", "ingot-mail[aiosmtplib]>=0.5.0,<0.6"]
web = [
    "ingot-auth[pymongo,redis,starlette]",
    "ingot-mail[aiosmtplib]>=0.5.0,<0.6",
    "uvicorn[standard]>=0.54,<1",
]

[project.urls]
repository = "https://github.com/ak-ingots/ingot-auth"
changelog = "https://github.com/ak-ingots/ingot-auth/blob/main/CHANGELOG.md"
documentation = "https://ingots.readthedocs.io/projects/ingot-auth/"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ingot_auth"
module-root = ""
wheel-exclude = ["**/CLAUDE.md"]

[tool.uv]
required-version = ">=0.13.5"
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]

[dependency-groups]
dev = [
    "black",
    "coverage",
    "flake8",
    "flake8-class-attributes-order",
    "flake8-pyproject",
    "grpcio-tools>=1.84.1",
    "ingot-mail[aiosmtplib]>=0.5.0,<0.6",
    "ingot-grpcio>=0.16.0,<0.17",
    "ingot-pymongo>=0.17.0,<0.18",
    "ingot-redis>=0.5.0,<0.6",
    "ingot-starlette[protobuf]>=0.4.0,<0.5",
    "httpx",
    "mypy",
    "mypy-protobuf>=5.1.0",
    "types-grpcio>=1.84.0.20261021",
    "types-grpcio-status>=1.0.0.20260408",
    "types-protobuf>=7.35.1.20260906",
]
changelog = ["towncrier"]
doc = [
    "sphinx>=8",
    "sphinx-rtd-theme>=3",
    "myst-parser>=4",
]

[tool.black]
line-length = 88
extend-exclude = "_pb2(_grpc)?\\.pyi?$"

[tool.flake8]
exclude = [".git", ".venv", "*_pb2.py", "*_pb2_grpc.py", "*_pb2.pyi", "*_pb2_grpc.pyi"]
max-line-length = 88
extend-ignore = ["E203", "E701", "E704"]
class_attributes_order = [
    "nested_class",
    "constant",
    "field",
    "static_method",
    "protected_static_method",
    "class_method",
    "protected_class_method",
    "__init__",
    "property_method",
    "protected_property_method",
    "magic_method",
    "method",
    "protected_method",
]

[tool.mypy]
strict = true
python_version = "3.14"
enable_error_code = ["deprecated", "explicit-override"]
# the generated code is checked through the stubs mypy-protobuf writes
exclude = ["_pb2(_grpc)?\\.py$"]

[[tool.mypy.overrides]]
# the stubs mypy-protobuf generates override without @override
module = ["ingot_auth.*.v1.*"]
disable_error_code = ["explicit-override"]

[[tool.mypy.overrides]]
# googleapis-common-protos ships the stubs of its code, without py.typed
module = ["google.api", "google.api.*", "google.rpc", "google.rpc.*"]
follow_untyped_imports = true

[tool.towncrier]
name = "ingot-auth"
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] - {project_date}"
issue_format = "[#{issue}](https://github.com/ak-ingots/ingot-auth/issues/{issue})"
underlines = ["", "", ""]
wrap = false
template = "changelog.d/_template.md"
ignore = ["README.md", "_template.md"]

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Misc"
showcontent = false

[tool.coverage.run]
branch = true
source = ["ingot_auth"]
omit = ["*_pb2.py", "*_pb2_grpc.py"]

[tool.coverage.report]
fail_under = 99
show_missing = true
skip_covered = true
exclude_also = [
    "if t.TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
