syntax = "proto3";

package ingot_auth.attrs.v1;

import "google/protobuf/timestamp.proto";

// A value of an attribute, of the profiles or of the sessions, by the id of
// the attribute in its registry, of the one variant of its type.
message AttrValue {
  uint32 attr_id = 1;
  oneof value {
    bool bool_value = 2;
    int64 int_value = 3;
    // a decimal as a string, to keep its digits: "1.50"
    string decimal_value = 4;
    google.protobuf.Timestamp datetime_value = 5;
    string str_value = 6;
  }
}
