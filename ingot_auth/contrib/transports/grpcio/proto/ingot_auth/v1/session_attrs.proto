syntax = "proto3";

package ingot_auth.session_attrs.v1;

// The attributes of the sessions, as their administrator manages them.
service SessionAttrs {
  // Requires PERMISSION_CAN_CREATE.
  rpc Create(CreateSessionAttrRequest) returns (CreateSessionAttrResponse);
  // Requires PERMISSION_CAN_READ.
  rpc List(ListSessionAttrsRequest) returns (ListSessionAttrsResponse);
  // Requires PERMISSION_CAN_RENAME.
  rpc Rename(RenameSessionAttrRequest) returns (RenameSessionAttrResponse);
  // Requires PERMISSION_CAN_DELETE.
  rpc Delete(DeleteSessionAttrRequest) returns (DeleteSessionAttrResponse);
}

// The bits of the domain `auth.session_attrs` the RPCs require: an aid for a
// client building its interface, the server checks them anyway.
enum Permission {
  PERMISSION_UNSPECIFIED = 0;
  PERMISSION_CAN_CREATE = 1;
  PERMISSION_CAN_READ = 2;
  PERMISSION_CAN_RENAME = 4;
  PERMISSION_CAN_DELETE = 8;
}

enum AttrType {
  ATTR_TYPE_UNSPECIFIED = 0;
  ATTR_TYPE_BOOL = 1;
  ATTR_TYPE_INT = 2;
  ATTR_TYPE_DECIMAL = 3;
  ATTR_TYPE_DATETIME = 4;
  ATTR_TYPE_STR = 5;
}

// Who gives the values of an attribute: a client never gives those of the
// transport.
enum SessionAttrSource {
  SESSION_ATTR_SOURCE_UNSPECIFIED = 0;
  SESSION_ATTR_SOURCE_TRANSPORT = 1;
  SESSION_ATTR_SOURCE_CLIENT = 2;
  SESSION_ATTR_SOURCE_PROVIDER = 3;
  SESSION_ATTR_SOURCE_DERIVED = 4;
}

message SessionAttr {
  uint32 id = 1;
  string name = 2;
  AttrType type = 3;
  SessionAttrSource source = 4;
}

message CreateSessionAttrRequest {
  SessionAttr session_attr = 1;
}

message CreateSessionAttrResponse {
  SessionAttr session_attr = 1;
}

message ListSessionAttrsRequest {}

message ListSessionAttrsResponse {
  repeated SessionAttr session_attrs = 1;
}

message RenameSessionAttrRequest {
  uint32 id = 1;
  string name = 2;
}

message RenameSessionAttrResponse {
  SessionAttr session_attr = 1;
}

message DeleteSessionAttrRequest {
  uint32 id = 1;
}

message DeleteSessionAttrResponse {}
