syntax = "proto3";

package ingot_auth.metadata.v1;

// The registries and the methods as the consumers read them: a client asks
// for them before signing in, so a server gives anyone PERMISSION_CAN_READ by
// default.
service Metadata {
  // Requires PERMISSION_CAN_READ.
  rpc GetMetadata(GetMetadataRequest) returns (GetMetadataResponse);
}

// The bits of the domain `auth.metadata` the RPCs require: an aid for a client
// building its interface, the server checks them anyway.
enum Permission {
  PERMISSION_UNSPECIFIED = 0;
  PERMISSION_CAN_READ = 1;
}

enum AttrType {
  ATTR_TYPE_UNSPECIFIED = 0;
  ATTR_TYPE_BOOL = 1;
  ATTR_TYPE_INT = 2;
  ATTR_TYPE_DECIMAL = 3;
  ATTR_TYPE_DATETIME = 4;
  ATTR_TYPE_STR = 5;
}

// The registries of the profiles: the ids a profile holds, with their names.
message Profile {
  message Tag {
    uint32 id = 1;
    string name = 2;
  }

  message Attr {
    uint32 id = 1;
    string name = 2;
    AttrType type = 3;
  }

  repeated Tag tags = 1;
  repeated Attr attrs = 2;
}

// What a client gives of a session: the attributes it is the source of, the
// presets, and their bindings to those attributes, flat lists linked by ids.
message Session {
  message Attr {
    uint32 id = 1;
    string name = 2;
    AttrType type = 3;
  }

  message Preset {
    uint32 id = 1;
    string name = 2;
  }

  message Binding {
    uint32 preset_id = 1;
    uint32 attr_id = 2;
    bool required = 3;
  }

  repeated Attr attrs = 1;
  repeated Preset presets = 2;
  repeated Binding bindings = 3;
}

// A method of the server: the path of its slot, `nickname`, `email_code`,
// and whether each flow is open, closed as well when the method does not
// take it.
message Method {
  string name = 1;
  bool sign_up = 2;
  bool sign_in = 3;
}

message GetMetadataRequest {}

message GetMetadataResponse {
  Profile profile = 1;
  Session session = 2;
  repeated Method methods = 3;
}
