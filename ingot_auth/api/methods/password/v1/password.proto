syntax = "proto3";

package ingot_auth.api.methods.password.v1;

import "google/api/annotations.proto";

// The password of the profile of the caller, a credential the methods of a
// password share: its change, in the session of the token of a call.
service Password {
  // Requires PERMISSION_CAN_CHANGE. The old password verified, the new one
  // checked by its policies; the other sessions of the profile closed, this
  // one kept; the user told. A wrong old password is PERMISSION_DENIED of
  // the reason PASSWORD_REFUSED, the session kept.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse) {
    option (google.api.http) = {post: "/v1/methods/password:change" body: "*"};
  }
}

// The bits of the domain `auth.methods.password` the RPCs require, which
// `auth.grp_signed_in` grants: an aid for a client building its interface,
// the server checks them anyway.
enum Permission {
  PERMISSION_UNSPECIFIED = 0;
  PERMISSION_CAN_CHANGE = 1;
}

message ChangePasswordRequest {
  string old_password = 1;
  string new_password = 2;
}

message ChangePasswordResponse {
  // How many other sessions of the profile the change closed.
  uint32 revoked_count = 1;
}
