syntax = "proto3";

package ingot_auth.sign_in.v1;

import "ingot_auth/methods/v1/challenges.proto";

// The answers of a sign-in, by any method or factor: whose challenge it is,
// the attempt knows.
service SignIn {
  // Requires PERMISSION_CAN_SIGN_IN, and that of the method of the attempt.
  rpc AnswerSignIn(AnswerSignInRequest) returns (AnswerSignInResponse);
}

// The bits of the domain `auth.sign_in` a sign-in requires, besides the flag
// of its method: an aid for a client building its interface, the server
// checks them anyway.
enum Permission {
  PERMISSION_UNSPECIFIED = 0;
  PERMISSION_CAN_SIGN_IN = 1;
}

message AnswerSignInRequest {
  string attempt_id = 1;
  // the kind of the answer, as the challenge asks for it
  oneof answer {
    string code = 2;
  }
}

message AnswerSignInResponse {
  SignInResult result = 1;
}

// What a step of a sign-in gives, by any method: what the method or a second
// factor asks for, or the end of the sign-in.
message SignInResult {
  oneof result {
    ingot_auth.methods.v1.Challenge challenge = 1;
    SignedIn signed_in = 2;
  }
}

// The sign-in is over: a session is open, its token given once, which the
// client sends with each call, and its id, public.
message SignedIn {
  string session_id = 1;
  string token = 2;
}
