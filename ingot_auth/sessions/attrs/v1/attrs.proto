syntax = "proto3";

package ingot_auth.sessions.attrs.v1;

// The attributes of the sessions, as their administrator manages them.
service Attrs {
  // Requires PERMISSION_CAN_CREATE.
  rpc CreateAttr(CreateAttrRequest) returns (CreateAttrResponse);
  // Requires PERMISSION_CAN_READ.
  rpc ListAttrs(ListAttrsRequest) returns (ListAttrsResponse);
  // Requires PERMISSION_CAN_RENAME.
  rpc RenameAttr(RenameAttrRequest) returns (RenameAttrResponse);
  // Requires PERMISSION_CAN_DELETE.
  rpc DeleteAttr(DeleteAttrRequest) returns (DeleteAttrResponse);
}

// The bits of the domain `auth.sessions.attrs` the RPCs require: an aid for a
// client building its interface, the server checks them anyway.
enum Permission {
  PERMISSION_UNSPECIFIED = 0;
  PERMISSION_CAN_CREATE = 1;
  PERMISSION_CAN_READ = 2;
  PERMISSION_CAN_RENAME = 4;
  PERMISSION_CAN_DELETE = 8;
}

enum AttrType {
  ATTR_TYPE_UNSPECIFIED = 0;
  ATTR_TYPE_BOOL = 1;
  ATTR_TYPE_INT = 2;
  ATTR_TYPE_DECIMAL = 3;
  ATTR_TYPE_DATETIME = 4;
  ATTR_TYPE_STR = 5;
}

// Who gives the values of an attribute: a client never gives those of the
// transport.
enum AttrSource {
  ATTR_SOURCE_UNSPECIFIED = 0;
  ATTR_SOURCE_TRANSPORT = 1;
  ATTR_SOURCE_CLIENT = 2;
  ATTR_SOURCE_PROVIDER = 3;
  ATTR_SOURCE_DERIVED = 4;
}

message Attr {
  uint32 id = 1;
  string name = 2;
  AttrType type = 3;
  AttrSource source = 4;
}

message CreateAttrRequest {
  Attr attr = 1;
}

message CreateAttrResponse {
  Attr attr = 1;
}

message ListAttrsRequest {}

message ListAttrsResponse {
  repeated Attr attrs = 1;
}

message RenameAttrRequest {
  uint32 id = 1;
  string name = 2;
}

message RenameAttrResponse {
  Attr attr = 1;
}

message DeleteAttrRequest {
  uint32 id = 1;
}

message DeleteAttrResponse {}
