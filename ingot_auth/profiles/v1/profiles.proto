syntax = "proto3";

package ingot_auth.profiles.v1;

import "ingot_auth/attrs/v1/attrs.proto";

// The profiles themselves: the profile of the caller, as its client sees
// it; the values an operator sets, the tags and the values of the attributes
// of a profile, the whole set each time. Every reply to a signed-in caller,
// of any service, tells the hash of its profile in its trailing metadata,
// `ingot-auth-user-profile-hash`: a client asks for the profile again when
// it differs from its own.
service Profiles {
  // Requires PERMISSION_CAN_READ_OWN.
  rpc GetOwnProfile(GetOwnProfileRequest) returns (GetOwnProfileResponse);
  // Requires PERMISSION_CAN_UPDATE.
  rpc SetProfileTags(SetProfileTagsRequest) returns (SetProfileTagsResponse);
  // Requires PERMISSION_CAN_UPDATE.
  rpc SetProfileAttrValues(SetProfileAttrValuesRequest)
      returns (SetProfileAttrValuesResponse);
}

// The bits of the domain `auth.profiles` its operations require: an aid for
// a client building its interface, the server checks them anyway.
enum Permission {
  PERMISSION_UNSPECIFIED = 0;
  PERMISSION_CAN_UPDATE = 1;
  PERMISSION_CAN_READ_OWN = 2;
}

// The values of a profile, by the ids of their registries.
message ProfileValues {
  repeated uint32 tag_uids = 1;
  repeated ingot_auth.attrs.v1.AttrValue attr_values = 2;
}

message GetOwnProfileRequest {}

message GetOwnProfileResponse {
  ProfileValues values = 1;
  // a mask per domain
  map<string, uint64> permissions = 2;
  // that of the trailing metadata of the replies
  string hash = 3;
}

message SetProfileTagsRequest {
  string uid = 1;
  // all the tags it is to have
  repeated uint32 tag_uids = 2;
}

message SetProfileTagsResponse {
  ProfileValues values = 1;
}

message SetProfileAttrValuesRequest {
  string uid = 1;
  // all the values it is to have
  repeated ingot_auth.attrs.v1.AttrValue attr_values = 2;
}

message SetProfileAttrValuesResponse {
  ProfileValues values = 1;
}
