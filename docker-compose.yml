# The MongoDB of the tests of the storage: `make integration`, `coverage` and
# `installed-test` start it, run the tests against it and stop it. A replica set
# of one node, as MongoDB takes transactions on a replica set only; the node
# listens on the port the tests reach it by, which is the host it is known by
# in the set. No authentication: a replica set with it needs a key file.
services:
  mongodb:
    image: mongo:9
    command:
      - --replSet=rs0
      - --bind_ip_all
      - --port=${INGOT_AUTH_TEST_PORT:-27118}
    ports:
      - "127.0.0.1:${INGOT_AUTH_TEST_PORT:-27118}:${INGOT_AUTH_TEST_PORT:-27118}"
    healthcheck:
      # initiates the set on the first check, healthy once the node is primary
      test:
        - CMD
        - mongosh
        - --quiet
        - --port=${INGOT_AUTH_TEST_PORT:-27118}
        - --eval
        - >-
          try { rs.status() } catch (e) { rs.initiate({_id: "rs0", members:
          [{_id: 0, host: "127.0.0.1:${INGOT_AUTH_TEST_PORT:-27118}"}]}) };
          quit(db.hello().isWritablePrimary ? 0 : 1)
      interval: 2s
      timeout: 5s
      retries: 30
