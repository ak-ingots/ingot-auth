# The MongoDB of the tests of the storage and the Redis of those of the cache:
# `make integration`, `coverage` and `installed-test` start them, run the tests
# against them and stop them. MongoDB is a replica set of one node, as MongoDB
# takes transactions on a replica set only; the node listens on the port the
# tests reach it by, which is the host it is known by in the set. No
# authentication: a replica set with it needs a key file.
services:
  mongodb:
    image: mongo:9
    command:
      - --replSet=rs0
      - --bind_ip_all
      - --port=${INGOT_AUTH_TEST_PORT:-27118}
      # no log of each connection, the healthchecks' among them
      - --quiet
    ports:
      - "127.0.0.1:${INGOT_AUTH_TEST_PORT:-27118}:${INGOT_AUTH_TEST_PORT:-27118}"
    # the open files MongoDB recommends: a test drops the database and the next
    # creates its collections anew, and the server keeps the files of the
    # dropped ones open for a while, past the 1024 a container may get
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    healthcheck:
      # initiates the set on the first check, healthy once the node is primary
      test:
        - CMD
        - mongosh
        - --quiet
        - --port=${INGOT_AUTH_TEST_PORT:-27118}
        - --eval
        - >-
          try { rs.status() } catch (e) { rs.initiate({_id: "rs0", members:
          [{_id: 0, host: "127.0.0.1:${INGOT_AUTH_TEST_PORT:-27118}"}]}) };
          quit(db.hello().isWritablePrimary ? 0 : 1)
      interval: 2s
      timeout: 5s
      retries: 30

  # The Redis of the tests of the cache, with no authentication either.
  redis:
    image: redis:8.8-alpine
    ports:
      - "127.0.0.1:${INGOT_AUTH_TEST_REDIS_PORT:-16380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
